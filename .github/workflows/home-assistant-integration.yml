name: Home Assistant integration
on:
  push:
    paths: ["custom_components/**", "home-assistant/integration-tests/**", ".github/workflows/home-assistant-integration.yml"]
  pull_request:
    paths: ["custom_components/**", "home-assistant/integration-tests/**", ".github/workflows/home-assistant-integration.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.10.0", "2026.11.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      # The fixture package can lag new HA releases. Install its current test
      # dependencies first, then select the HA version being tested explicitly.
      - run: pip install pytest-homeassistant-custom-component==0.13.375
      - run: pip install --upgrade homeassistant==${{ matrix.homeassistant }}
      # HA 2026.11 must initialize its HTTP aliases before pytest plugins import
      # HTTP clients. Import HA first, then run the same test suite.
      - run: |
          python - <<'PY'
          import homeassistant
          import pytest
          raise SystemExit(pytest.main(["--confcutdir=home-assistant/integration-tests", "home-assistant/integration-tests", "-q", "-o", "asyncio_mode=auto"]))
          PY
